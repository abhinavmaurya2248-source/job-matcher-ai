{# Reusable statistic card.
   Params: label, value, hint (optional), placeholder (bool), text_value (bool),
           accent (optional: violet | pink | candy — colours the top gradient line) #}
<div class="card stat-card card-hover h-100{% if accent %} is-{{ accent }}{% endif %}">
  <div class="card-body">
    <p class="stat-label mb-3">{{ label }}</p>
    <p class="stat-value {{ 'is-text' if text_value else '' }} mb-2">{{ value }}</p>
    {% if hint %}<p class="small text-muted-soft mb-0">{{ hint }}</p>{% endif %}
    {% if placeholder %}
      <span class="badge badge-placeholder mt-2">Placeholder</span>
    {% endif %}
  </div>
</div>
