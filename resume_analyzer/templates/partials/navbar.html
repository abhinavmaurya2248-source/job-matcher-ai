<nav class="navbar navbar-expand-lg navbar-dark app-navbar sticky-top" aria-label="Main navigation">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('index') }}">
      <span class="brand-mark" aria-hidden="true">AI</span> ResumeAI
    </a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#mainNav"
      aria-controls="mainNav"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav mx-lg-auto gap-lg-1">
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{{ url_for('index') }}">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}">Dashboard</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path in ['/analyze', '/upload'] %}active{% endif %}" href="{{ url_for('analyze') }}">Analyze Resume</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/history' or request.path.startswith('/analyses') %}active{% endif %}" href="{{ url_for('history') }}">History</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.path == '/profile' %}active{% endif %}" href="{{ url_for('profile') }}">Profile</a>
        </li>
      </ul>
      <ul class="navbar-nav align-items-lg-center gap-2 mt-2 mt-lg-0">
        {% if current_user %}
          <li class="nav-item">
            <span class="nav-user">
              <span class="nav-avatar" aria-hidden="true">{{ current_user['full_name'][0]|upper }}</span>
              <span class="d-lg-none d-xl-inline">Signed in as <span class="fw-semibold text-light">{{ current_user['full_name'] }}</span></span>
            </span>
          </li>
          <li class="nav-item">
            <a class="btn btn-ghost btn-sm px-3" href="{{ url_for('logout') }}">Logout</a>
          </li>
        {% else %}
          <li class="nav-item">
            <a class="btn btn-ghost btn-sm px-3" href="{{ url_for('login') }}">Login</a>
          </li>
          <li class="nav-item">
            <a class="btn btn-accent btn-sm px-3" href="{{ url_for('register') }}">Register</a>
          </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
