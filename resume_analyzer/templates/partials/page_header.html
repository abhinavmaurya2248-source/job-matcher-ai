{# Reusable page header. Params: heading, sub (optional), eyebrow (optional) #}
<div class="page-header">
  <div class="container fade-up">
    {% if eyebrow %}<p class="eyebrow mb-2">{{ eyebrow }}</p>{% endif %}
    <h1 class="mb-2">{{ heading }}</h1>
    {% if sub %}<p class="mb-0 text-muted-soft">{{ sub }}</p>{% endif %}
  </div>
</div>
