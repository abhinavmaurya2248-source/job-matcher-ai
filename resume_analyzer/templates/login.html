{% extends "base.html" %}

{% block title %}Login - AI Resume Analyzer{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="card auth-card">
        <div class="card-body p-4">
          <h1 class="h4 mb-1">Login</h1>
          <p class="small text-muted-soft">Sign in with the email and password you registered with.</p>

          <form class="needs-validation" method="post" action="{{ url_for('login') }}" novalidate>
            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <input
                class="form-control"
                type="email"
                id="email"
                name="email"
                value="{{ form_email or '' }}"
                placeholder="you@example.com"
                required
              />
              <div class="invalid-feedback">Please enter a valid email address.</div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">Password</label>
              <input class="form-control" type="password" id="password" name="password" required />
              <div class="invalid-feedback">Please enter your password.</div>
            </div>
            <button class="btn btn-accent w-100" type="submit">Login</button>
          </form>

          <p class="small mt-3 mb-0">
            New here? <a href="{{ url_for('register') }}">Create an account</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
